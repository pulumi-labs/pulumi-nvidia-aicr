name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build-provider:
    name: build provider (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: provider/go.sum
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build provider binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/pulumi-resource-nvidia-aicr${ext}"
          (cd provider && go build \
            -ldflags "-X github.com/pulumi-labs/pulumi-nvidia-aicr/provider/pkg/version.Version=${{ steps.ver.outputs.version }}" \
            -o "../${out}" \
            ./cmd/pulumi-resource-nvidia-aicr)
          tar -czf "dist/pulumi-resource-nvidia-aicr-v${{ steps.ver.outputs.version }}-${GOOS}-${GOARCH}.tar.gz" \
            -C dist "pulumi-resource-nvidia-aicr${ext}"
          rm -f "${out}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  generate-sdks:
    name: generate SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: provider/go.sum
      - uses: pulumi/actions@v6
        with:
          pulumi-version: '3.241.0'
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build provider with release version
        run: make provider VERSION=${{ steps.ver.outputs.version }}
      - name: Generate all SDKs
        run: make sdks VERSION=${{ steps.ver.outputs.version }}
      - name: Stamp version into SDK manifests (fallback)
        run: make set_version VERSION=${{ steps.ver.outputs.version }}
      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdks
          path: sdk/
          if-no-files-found: error

  publish-github-release:
    name: publish GitHub Release
    needs: [build-provider, generate-sdks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Bundle SDK source archives
        run: |
          mkdir -p release
          cp artifacts/provider-*/*.tar.gz release/
          cd artifacts/sdks
          for lang in nodejs python go dotnet java; do
            if [ -d "$lang" ]; then
              tar -czf "../../release/sdk-${lang}-${GITHUB_REF_NAME}.tar.gz" "$lang"
            fi
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-nodejs:
    name: publish to npm
    needs: generate-sdks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: esc-secrets
        uses: pulumi/esc-action@9eb774255b1a4afb7855678ae8d4a77359da0d9b
        env:
          ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
          ESC_ACTION_OIDC_AUTH: "true"
          ESC_ACTION_OIDC_ORGANIZATION: pulumi
          ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: sdks
          path: sdk
      - name: Install and build
        run: cd sdk/nodejs && npm install && npm run build
      - name: Publish
        run: cd sdk/nodejs && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ steps.esc-secrets.outputs.NPM_TOKEN }}

  publish-python:
    name: publish to PyPI
    needs: generate-sdks
    runs-on: ubuntu-latest
    # PyPI's pending Trusted Publisher is bound to this exact environment
    # name and workflow filename; both must match for OIDC to be accepted.
    environment: publish-pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: sdks
          path: sdk
      - name: Build distributions
        run: |
          cd sdk/python
          python -m pip install --upgrade build
          python -m build --sdist --wheel
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  publish-dotnet:
    name: publish to NuGet
    needs: generate-sdks
    runs-on: ubuntu-latest
    # NuGet's Trusted Publisher policy is bound to (repo owner, repo,
    # workflow filename, optional environment). The environment here must
    # match the policy on nuget.org.
    environment: publish-nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Fetch NUGET_USER (the nuget.org policy-owner profile slug; not
      # secret but kept in ESC for consistency with the rest of the
      # publishing config).
      - id: esc-secrets
        uses: pulumi/esc-action@9eb774255b1a4afb7855678ae8d4a77359da0d9b
        env:
          ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
          ESC_ACTION_OIDC_AUTH: "true"
          ESC_ACTION_OIDC_ORGANIZATION: pulumi
          ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: sdks
          path: sdk
      - name: Pack
        run: cd sdk/dotnet && dotnet pack -c Release -o nupkgs
      # Exchange the GitHub OIDC token for a short-lived (~1h, single-use)
      # nuget.org API key. `user` is the policy owner's nuget.org profile
      # slug (can be a user or an organization slug).
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ steps.esc-secrets.outputs.NUGET_USER }}
      - name: Push
        run: |
          cd sdk/dotnet
          dotnet nuget push 'nupkgs/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"

  publish-java:
    name: publish to Maven Central
    # Disabled until a GPG signing key is generated and stored in ESC as
    # SIGNING_KEY (ASCII-armored, full BEGIN/END block) and
    # SIGNING_PASSWORD. Maven Central rejects unsigned artifacts, so this
    # is the one piece that has to exist before flipping `if: false`. The
    # com.pulumi.labs namespace is already verified on Sonatype Central
    # Portal, and the OSSRH user token is already in ESC.
    #
    # Follow-up (not blocking): migrate to Sonatype Trusted Publishing
    # (OIDC), analogous to the PyPI and NuGet flows. That would drop the
    # OSSRH user token in favour of short-lived OIDC-minted credentials,
    # but the GPG signing key is still required.
    if: false
    needs: generate-sdks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: esc-secrets
        uses: pulumi/esc-action@9eb774255b1a4afb7855678ae8d4a77359da0d9b
        env:
          ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
          ESC_ACTION_OIDC_AUTH: "true"
          ESC_ACTION_OIDC_ORGANIZATION: pulumi
          ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: sdks
          path: sdk
      # The generated build.gradle reads SIGNING_KEY / SIGNING_PASSWORD
      # for in-memory PGP signing (required by Maven Central) and
      # PUBLISH_REPO_USERNAME / PUBLISH_REPO_PASSWORD for Sonatype. The
      # OSSRH_USERNAME / OSSRH_PASSWORD entries already in ESC are
      # renamed here to the env names the gradle build expects; no ESC
      # rename needed. The gradle-nexus.publish-plugin task chain stages
      # artifacts, closes the staging repo, and triggers release.
      - name: Publish to Sonatype
        working-directory: sdk/java
        env:
          SIGNING_KEY: ${{ steps.esc-secrets.outputs.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ steps.esc-secrets.outputs.SIGNING_PASSWORD }}
          PUBLISH_REPO_USERNAME: ${{ steps.esc-secrets.outputs.OSSRH_USERNAME }}
          PUBLISH_REPO_PASSWORD: ${{ steps.esc-secrets.outputs.OSSRH_PASSWORD }}
        run: gradle publishToSonatype closeAndReleaseSonatypeStagingRepository
