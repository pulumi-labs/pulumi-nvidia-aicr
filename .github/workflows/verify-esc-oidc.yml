name: verify-esc-oidc

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    name: verify ESC OIDC trust
    runs-on: ubuntu-latest
    steps:
      - name: Fetch secrets from ESC via OIDC
        id: esc-secrets
        uses: pulumi/esc-action@9eb774255b1a4afb7855678ae8d4a77359da0d9b
        env:
          ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
          ESC_ACTION_OIDC_AUTH: "true"
          ESC_ACTION_OIDC_ORGANIZATION: pulumi
          ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization

      - name: Report which keys resolved
        env:
          NPM_TOKEN: ${{ steps.esc-secrets.outputs.NPM_TOKEN }}
          PYPI_API_TOKEN: ${{ steps.esc-secrets.outputs.PYPI_API_TOKEN }}
          NUGET_API_KEY: ${{ steps.esc-secrets.outputs.NUGET_API_KEY }}
          NUGET_PUBLISH_KEY: ${{ steps.esc-secrets.outputs.NUGET_PUBLISH_KEY }}
        run: |
          echo "OIDC token exchange + ESC environment open: SUCCEEDED"
          for k in NPM_TOKEN PYPI_API_TOKEN NUGET_API_KEY NUGET_PUBLISH_KEY; do
            if [ -n "${!k}" ]; then
              echo "  - $k: present"
            else
              echo "  - $k: absent"
            fi
          done
