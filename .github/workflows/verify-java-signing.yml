name: verify java signing key

# Manual-trigger sanity check for the Maven Central GPG signing material
# stored in ESC. Imports the key into gpg in the runner, lists the
# imported fingerprint, and performs a test clearsign with the passphrase
# so we can diagnose "Could not read PGP secret key" from gradle without
# burning a release tag.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - id: esc-secrets
        uses: pulumi/esc-action@9eb774255b1a4afb7855678ae8d4a77359da0d9b
        env:
          ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
          ESC_ACTION_OIDC_AUTH: "true"
          ESC_ACTION_OIDC_ORGANIZATION: pulumi
          ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
      - name: Inspect signing key shape (no value leakage)
        env:
          SIGNING_KEY: ${{ steps.esc-secrets.outputs.MAVEN_CENTRAL_SIGNING_KEY }}
        run: |
          echo "byte length: ${#SIGNING_KEY}"
          echo "line count : $(printf '%s' "$SIGNING_KEY" | wc -l)"
          # GitHub Actions masks the exact secret value but not arbitrary
          # substrings, so individual lines from inside the armor block
          # would still be masked. The BEGIN/END markers are public per
          # the OpenPGP spec; printing them only confirms armor framing.
          echo "starts with BEGIN marker? $(printf '%s' "$SIGNING_KEY" | head -c 35)"
          echo "ends with END marker?     $(printf '%s' "$SIGNING_KEY" | tail -c 35)"
      - name: Dump raw byte structure around armor markers
        env:
          SIGNING_KEY: ${{ steps.esc-secrets.outputs.MAVEN_CENTRAL_SIGNING_KEY }}
        run: |
          set -e
          # Write the value verbatim (no printf interpretation, no quoting
          # variation). od on the first 300 bytes will reveal whether the
          # separators are real LFs, CR, CRLF, or literal escape sequences.
          printf '%s' "$SIGNING_KEY" > /tmp/raw.bin
          echo "byte length on disk: $(wc -c < /tmp/raw.bin)"
          echo "--- od -c first 300 bytes ---"
          head -c 300 /tmp/raw.bin | od -c | head -25
          echo "--- od -c bytes 5200..5500 (mid-body) ---"
          dd if=/tmp/raw.bin bs=1 skip=5200 count=300 status=none | od -c | head -25
          echo "--- od -c last 300 bytes ---"
          tail -c 300 /tmp/raw.bin | od -c | head -25
          shred -u /tmp/raw.bin
