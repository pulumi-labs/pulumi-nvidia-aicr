name: aws-eks-gb300-training
runtime: nodejs
description: >-
  Deploy an NVIDIA AICR-validated Kubeflow training stack on AWS EKS with a GB300 NVL72 (p6e-gb300r.36xlarge) managed node group pinned to an EC2 Capacity Block. COST WARNING: GB300 capacity is billed per reservation; destroy when done.
config:
  aws:region:
    value: us-east-1
