name: aicr-quickstart
runtime: yaml
description: |
  Quickstart: Deploy NVIDIA AICR on an existing Kubernetes cluster, in YAML.
  The simplest way to get started with AICR and Pulumi.

config:
  accelerator:
    type: string
    default: h100
  service:
    type: string
    default: eks
  intent:
    type: string
    default: training
  platform:
    type: string
    default: ""
  os:
    type: string
    default: ""

resources:
  aicr:
    type: nvidia-aicr:index:ClusterStack
    properties:
      accelerator: ${accelerator}
      service: ${service}
      intent: ${intent}
      platform: ${platform}
      os: ${os}

  # Uncomment to run empirical validation (~10 minutes, needs provider >= 0.3.0).
  # Uses the same ambient kubeconfig as the stack; the wired criteria keep a
  # single source of truth with whatever `pulumi config` resolved to.
  #
  # aicr-validation:
  #   type: nvidia-aicr:index:ValidationRun
  #   properties:
  #     criteria: ${aicr.criteria} # same recipe as the stack -- no drift
  #     recipeDataVersion: ${aicr.recipeVersion} # assert same recipe data as deployed
  #     triggers: # re-validate when the stack changes
  #       - ${aicr.deployedComponents}

outputs:
  recipeName: ${aicr.recipeName}
  recipeVersion: ${aicr.recipeVersion}
  deployedComponents: ${aicr.deployedComponents}
  componentCount: ${aicr.componentCount}
  # Uncomment along with the aicr-validation resource above:
  # validationStatus: ${aicr-validation.status}
  # validationChecks: ${aicr-validation.phaseResults}
